<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 900 336" width="900" height="336" role="img"><title>Real-time animal detection pipeline</title><desc>Animated pipeline: Raspberry Pi 5 with YOLOv5, MQTT over TLS, AWS IoT Core, Lambda with Haversine 1 km radius, SNS alerts to nearby vehicles.</desc><defs></defs><style>.sans{font-family:'Segoe UI','SF Pro Display',-apple-system,'Helvetica Neue',Arial,sans-serif}.mono{font-family:'SF Mono','JetBrains Mono',Consolas,Menlo,'DejaVu Sans Mono',monospace}@media (prefers-reduced-motion:reduce){*{animation:none!important}}
