.spin{animation:spin 6s linear infinite}
.flow{animation:flow 2.5s linear infinite}
.tw{animation:tw 3s ease-in-out infinite}
.uline{stroke-dasharray:260;animation:draw 1.6s cubic-bezier(.2,.7,.2,1) .3s both}
.blip{opacity:0;animation:blip 6s linear infinite}
.ring6{opacity:0;transform-box:fill-box;transform-origin:center;animation:ring6 6s linear infinite}
.ping{transform-box:fill-box;transform-origin:center;animation:ping 2.2s ease-out infinite}
</style>
