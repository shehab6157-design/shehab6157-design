</defs><style>.sans{font-family:'Segoe UI','SF Pro Display',-apple-system,'Helvetica Neue',Arial,sans-serif}.mono{font-family:'SF Mono','JetBrains Mono',Consolas,Menlo,'DejaVu Sans Mono',monospace}@media (prefers-reduced-motion:reduce){*{animation:none!important}}
