<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120">
  <defs>
    <radialGradient id="face" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#FFF6DC"/>
      <stop offset="35%" stop-color="#F0D98C"/>
      <stop offset="70%" stop-color="#C9A84C"/>
      <stop offset="100%" stop-color="#7A5E1E"/>
    </radialGradient>
    <linearGradient id="rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF6DC"/>
      <stop offset="50%" stop-color="#8A6D1F"/>
      <stop offset="100%" stop-color="#FFF6DC"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <g filter="url(#soft)">
    <circle cx="60" cy="60" r="55" fill="url(#rim)"/>
    <circle cx="60" cy="60" r="47" fill="url(#face)"/>
    <circle cx="60" cy="60" r="47" fill="none" stroke="#5c4813" stroke-width="1.2"/>
    <circle cx="60" cy="60" r="40" fill="none" stroke="#FFF6DC" stroke-width="0.6" opacity="0.5"/>
  </g>
  <text x="60" y="72" font-family="Georgia, 'Times New Roman', serif" font-size="38" font-weight="700" fill="#3a2c0a" text-anchor="middle">S</text>
  <ellipse cx="42" cy="36" rx="18" ry="9" fill="#FFFFFF" opacity="0.3" transform="rotate(-18 42 36)">
    <animate attributeName="opacity" values="0.12;0.5;0.12" dur="3.2s" repeatCount="indefinite"/>
  </ellipse>
  <circle cx="60" cy="60" r="55" fill="none" stroke="#F5E7B8" stroke-width="1" opacity="0.6">
    <animate attributeName="r" values="55;57;55" dur="2.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0.15;0.6" dur="2.6s" repeatCount="indefinite"/>
  </circle>
</svg>
