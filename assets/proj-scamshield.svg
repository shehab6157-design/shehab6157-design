<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 900 336" width="900" height="336" role="img"><title>ScamShield — encrypted messenger with built-in scam detection</title><desc>Animated flow: a message travels from sender through a Matrix/Dendrite homeserver and the ScamShield detection layer; scam messages are blocked, safe messages delivered.</desc><defs>
<clipPath id="shclip"><path d="M0,-40 L33,-27 V6 C33,28 15,42 0,50 C-15,42 -33,28 -33,6 V-27 Z"/></clipPath>
</defs><style>.sans{font-family:'Segoe UI','SF Pro Display',-apple-system,'Helvetica Neue',Arial,sans-serif}.mono{font-family:'SF Mono','JetBrains Mono',Consolas,Menlo,'DejaVu Sans Mono',monospace}@media (prefers-reduced-motion:reduce){*{animation:none!important}}
