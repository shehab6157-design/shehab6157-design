.bA{animation:mvA 10s linear infinite,clA 10s linear infinite;animation-delay:0s,0s;animation-fill-mode:backwards}

@keyframes mvB{0%{transform:translate(10px,236px);opacity:0}3%{transform:translate(10px,236px);opacity:1}
12%,14%{transform:translate(212px,236px)}22%,28%{transform:translate(432px,236px)}
42%,47%{transform:translate(662px,236px);opacity:1}50%,100%{transform:translate(662px,236px);opacity:0}}
@keyframes clB{0%,27%{stroke:#9A98A6;fill:#171722}28%,100%{stroke:#86EFAC;fill:#12261a}}
.bB{animation:mvB 10s linear infinite,clB 10s linear infinite;animation-delay:5s,5s;animation-fill-mode:backwards}

