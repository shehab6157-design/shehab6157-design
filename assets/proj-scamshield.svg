@keyframes vd{0%,29%{opacity:0}31%,46%{opacity:1}50%,100%{opacity:0}}
@keyframes flow{to{stroke-dashoffset:-20}}
.scan{animation:scan 1.5s ease-in-out infinite alternate}
.vd{animation:vd 10s linear infinite;animation-fill-mode:backwards}
.lane{animation:flow 1.2s linear infinite}
.bubr{fill:inherit;stroke:inherit;stroke-width:1.5}

@keyframes mvA{0%{transform:translate(10px,236px);opacity:0}3%{transform:translate(10px,236px);opacity:1}
